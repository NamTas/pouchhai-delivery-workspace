<rect x="338" y="344" width="148" height="34" rx="17" fill="#29535c"/><text x="412" y="366" text-anchor="middle" font-size="12" fill="#d9eee8">NO API KEY</text>
<text x="53" y="430" font-size="12" fill="#94b7c2">PYTHON  /  SQLITE  /  JAVASCRIPT</text></g>
