<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
<title id="title">Pouchhai delivery workspace</title><desc id="desc">An isometric parcel, review cards and a delivery path illustrate the order-to-follow-up workflow. Decorative illustration, not a live dashboard.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b2333"/><stop offset="1" stop-color="#17434b"/></linearGradient><linearGradient id="top" x2="1" y2="1"><stop stop-color="#ffd29b"/><stop offset="1" stop-color="#eda858"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#f9ffff"/><stop offset="1" stop-color="#c5e3df"/></linearGradient><filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#041725" flood-opacity=".5"/></filter><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#b5d9d8" stroke-opacity=".055"/></pattern></defs>
<rect width="1280" height="470" rx="22" fill="url(#bg)"/><rect width="1280" height="470" rx="22" fill="url(#grid)"/>
<circle cx="1120" cy="-40" r="240" fill="#56baaa" opacity=".055"/><circle cx="810" cy="470" r="220" fill="#91e4ce" opacity=".035"/>
<g font-family="DejaVu Sans,Arial,sans-serif"><rect x="52" y="46" width="43" height="43" rx="12" fill="#f3b36b"/><path d="M64 77l17-17m-12 0h12v12" fill="none" stroke="#173743" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="110" y="72" font-size="24" font-weight="700" letter-spacing="4" fill="#f7fbfc">POUCHHAI</text><text x="53" y="127" font-size="12" letter-spacing="3" fill="#a1d6c8">YOUR DELIVERY WORKSPACE</text>
<text x="49" y="194" font-size="48" font-weight="700" fill="#f5fafb">Every order.</text><text x="49" y="255" font-size="48" font-weight="700" fill="#f5fafb">A clear next step.</text>
<text x="53" y="302" font-size="18" fill="#c1d6de">Add records. Review delays. Keep the history.</text>
<rect x="53" y="344" width="132" height="34" rx="17" fill="#29535c"/><text x="119" y="366" text-anchor="middle" font-size="12" fill="#d9eee8">LOCAL-FIRST</text>
